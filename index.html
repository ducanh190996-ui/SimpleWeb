<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tìm file OneDrive</title>
  <link rel="stylesheet" href="style.css">

  <!-- Microsoft Authentication Library -->
  <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
</head>
<body>
  <main class="box">
    <h1>Tìm file trong OneDrive</h1>

    <button id="loginBtn">Đăng nhập Microsoft</button>
    <p id="account">Chưa đăng nhập</p>

    <div class="search-row">
      <input id="keyword" type="text" placeholder="Ví dụ: servo">
      <button id="searchBtn">Tìm kiếm</button>
    </div>

    <p id="status"></p>
    <div id="results"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
