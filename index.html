<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tìm file OneDrive</title>
  <link rel="stylesheet" href="style.css">

  <!-- MSAL Browser v2 - Microsoft CDN -->
  <script
    type="text/javascript"
    src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"
    integrity="sha384-PARf28kmic36Ve+O3DnUerRXFtOQ7ZDqRDGpLcbljly5/N39T2OV3kt3QsWOKeAX"
    crossorigin="anonymous">
  </script>
</head>

<body>
  <main class="box">
    <h1>Tìm file trong OneDrive</h1>

    <button id="loginBtn">Đăng nhập Microsoft</button>
    <p id="account">Chưa đăng nhập</p>

    <div class="search-row">
      <input id="keyword" type="text" placeholder="Ví dụ: servo">
      <button id="searchBtn">Tìm kiếm</button>
    </div>

    <p id="status"></p>
    <div id="results"></div>
  </main>

  <!-- script.js phải nằm sau MSAL -->
  <script src="script.js"></script>
</body>
</html>
