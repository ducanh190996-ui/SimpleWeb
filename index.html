<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Máy tính 4 phép tính</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator">
    <h1>Cộng / Trừ / Nhân / Chia</h1>

    <label for="number1">Số thứ nhất</label>
    <input id="number1" type="number" step="any" placeholder="Ví dụ: 10" />

    <label for="number2">Số thứ hai</label>
    <input id="number2" type="number" step="any" placeholder="Ví dụ: 3" />

    <div class="buttons">
      <button id="addBtn">+</button>
      <button id="subBtn">−</button>
      <button id="mulBtn">×</button>
      <button id="divBtn">÷</button>
    </div>

    <p id="result">Kết quả: --</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
